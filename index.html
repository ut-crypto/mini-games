<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Games</title>
  <meta name="theme-color" content="#0b0d10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }

    .game-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      margin: 0;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    a.game-card:hover { border-color: var(--amber-dim); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 181, 71, 0.15); }
    a.game-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .game-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 1px solid var(--rule-strong);
      border-radius: 4px;
      background: #08090b;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.7);
      font-family: var(--font-dot);
      font-size: 1.05rem;
      line-height: 1.1;
      text-align: center;
    }
    .game-icon .a { color: var(--amber); text-shadow: var(--glow-amber); }
    .game-icon .b { color: var(--cyan); text-shadow: var(--glow-cyan); }
    .shogi-icon { font-family: "Shippori Mincho B1", serif; font-weight: 700; font-size: 1.15rem; writing-mode: vertical-rl; letter-spacing: -0.05em; }

    .game-card h2 { margin: 0 0 2px; }
    .game-card p { margin: 0; color: var(--muted); font-size: 0.88rem; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      font-size: 0.72rem;
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 0 8px;
      color: var(--muted);
    }
    .tag.online { color: var(--cyan); border-color: var(--cyan-dim); }

    .go { font-family: var(--font-dot); color: var(--amber); font-size: 1.4rem; }

    .game-card.soon { opacity: 0.45; border-style: dashed; }
    .game-card.soon::before, .game-card.soon::after { display: none; }
    .game-card.soon .game-icon { color: var(--muted); font-size: 1.6rem; }

    footer { margin-top: 32px; text-align: center; color: #4f4c45; font-family: var(--font-dot); font-size: 0.75rem; letter-spacing: 0.2em; }

    @media (max-width: 420px) {
      .game-card { grid-template-columns: auto 1fr; }
      .go { display: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header class="masthead">
      <h1 class="brand"><span class="brand-hit">MINI</span><span class="amp"> </span><span class="brand-blow">GAMES</span></h1>
      <p class="tagline"><span class="led"></span>SELECT A GAME</p>
    </header>

    <p class="lead">ブラウザで遊べるミニゲーム集</p>

    <ul class="games">
      <li>
        <a class="card game-card" href="hit-and-blow/">
          <div class="game-icon"><span><span class="a">H</span>&amp;<span class="b">B</span></span></div>
          <div>
            <h2><span class="num">01</span>Hit &amp; Blow 5</h2>
            <p>重複なし5桁の数字を推理して当てる</p>
            <div class="tags">
              <span class="tag">ひとりで練習</span>
              <span class="tag online">オンライン対戦</span>
            </div>
          </div>
          <span class="go" aria-hidden="true">▶</span>
        </a>
      </li>
      <li>
        <a class="card game-card" href="shogi/">
          <div class="game-icon"><span class="shogi-icon"><span class="a">将</span><span class="b">棋</span></span></div>
          <div>
            <h2><span class="num">02</span>将棋</h2>
            <p>CPU は5段階。最上位「極」は水匠5+詰将棋ソルバー+定跡</p>
            <div class="tags">
              <span class="tag">CPU 対戦</span>
              <span class="tag online">オンライン対戦</span>
              <span class="tag">ふたりで対局</span>
              <span class="tag online">AI 対戦場</span>
            </div>
          </div>
          <span class="go" aria-hidden="true">▶</span>
        </a>
      </li>
      <li>
        <div class="card game-card soon" aria-disabled="true">
          <div class="game-icon">?</div>
          <div>
            <h2><span class="num">03</span>COMING SOON</h2>
            <p>次のゲームを準備中</p>
          </div>
        </div>
      </li>
    </ul>

    <footer>UT-CRYPTO / MINI GAMES</footer>
  </main>
</body>
</html>
