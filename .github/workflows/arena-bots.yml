# AI 対戦場: shogi/arena/bots/ にファイルが追加・削除されたら一覧(index.json)を更新する
name: Update arena bot list

on:
  push:
    branches: [master]
    paths:
      - 'shogi/arena/bots/**.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-bot-manifest.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shogi/arena/bots/index.json
          git commit -m "Update arena bot list"
          git push
